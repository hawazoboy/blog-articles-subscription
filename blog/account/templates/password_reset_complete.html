{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Contact Start -->
<div class="container-fluid">
    <h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4"><span
            class="bg-secondary pr-3">Forgot Password</span></h2>
    <div class=" px-xl-5">
        <div class=" mb-5 contact-us" style="">
            <div class="contact-form bg-light p-30">
                <div id="success"></div>
                <h1>Password Changed Successfully</h1>

                <p>
                    Your password has been updated.
                </p>
                <a href="{% url 'account:login' %}" class="btn btn-primary py-2 px-4">
                    Go To Login
                </a>

            </div>
        </div>

    </div>
</div>
<!-- Contact End -->

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>
</head>

<body>

    <h1>Password Changed Successfully</h1>

    <p>
        Your password has been updated.
    </p>

    <a href="{% url 'account:login' %}">
        Go To Login
    </a>

</body>

</html>
